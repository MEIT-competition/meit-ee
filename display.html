<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>위험음 방향 인지 벨트</title>
<style>
  :root {
    --bg: #0b0d12;
    --dim: #2a3040;
    --text: #e8ecf4;
    --muted: #7a8599;
    --accent: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vh;
    overflow: hidden;
  }
  #belt { position: relative; width: 46vh; height: 46vh; }
  #belt::after {
    content: ""; position: absolute; inset: 18%;
    border: 2px dashed var(--dim); border-radius: 50%;
  }
  .dot {
    position: absolute; width: 8vh; height: 8vh;
    margin: -4vh 0 0 -4vh; border-radius: 50%;
    background: var(--dim); transition: all .12s;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9vh; color: var(--muted);
  }
  .dot.on {
    background: var(--accent); color: #fff;
    box-shadow: 0 0 6vh var(--accent);
    transform: scale(1.35);
  }
  #label { font-size: 8vh; font-weight: 800; letter-spacing: .1em; }
  #sub { font-size: 4vh; color: var(--muted); letter-spacing: .06em; }
  .idle #label { color: var(--muted); font-size: 5vh; font-weight: 500; }
</style>
</head>
<body class="idle">
  <div id="belt"></div>
  <div id="label">대기 중</div>
  <div id="sub"></div>

<script>
const ACTIVE = [2, 6];       

const NAMES = ["앞","오른쪽 앞","오른쪽","오른쪽 뒤","뒤","왼쪽 뒤","왼쪽","왼쪽 앞"];
const CLASS_KR = { horn: "경적", siren: "사이렌", crash: "충돌음" };
const COLOR = { horn: "#ffb020", siren: "#ff4d4d", crash: "#ff7a2f" };

function resolve(direction) {
  if (direction === 2) return { dots: [2], text: "오른쪽" };
  if (direction === 6) return { dots: [6], text: "왼쪽" };
  return { dots: [2, 6], text: "뒤" };
}

const belt = document.getElementById("belt");
const dots = {};
ACTIVE.forEach(i => {
  const a = (i / 8) * 2 * Math.PI - Math.PI / 2;
  const el = document.createElement("div");
  el.className = "dot";
  el.textContent = NAMES[i];
  el.style.left = (50 + 50 * Math.cos(a)) + "%";
  el.style.top  = (50 + 50 * Math.sin(a)) + "%";
  belt.appendChild(el);
  dots[i] = el;
});

const label = document.getElementById("label");
const sub = document.getElementById("sub");
let lastSeq = -1, timer = null;

function clearDots() {
  Object.values(dots).forEach(d => d.classList.remove("on"));
}

function idle() {
  document.body.classList.add("idle");
  clearDots();
  label.textContent = "대기 중";
  sub.textContent = "";
}

function render(s) {
  clearTimeout(timer);
  clearDots();

  if (!s.sound_class) {
    document.body.classList.add("idle");
    label.textContent = "알림 없음";
    sub.textContent = "일상음으로 판단";
    timer = setTimeout(idle, 2500);
    return;
  }

  document.body.classList.remove("idle");
  document.documentElement.style.setProperty(
    "--accent", COLOR[s.sound_class] || "#ff4d4d");

  const r = resolve(s.direction);
  r.dots.forEach(i => { if (dots[i]) dots[i].classList.add("on"); });

  label.textContent = CLASS_KR[s.sound_class] || s.sound_class;
  sub.textContent = r.text + "  ·  세기 " + s.intensity;
  timer = setTimeout(idle, 4000);
}

setInterval(async () => {
  try {
    const s = await (await fetch("/state", { cache: "no-store" })).json();
    if (s.seq !== lastSeq) { lastSeq = s.seq; render(s); }
  } catch (e) {}
}, 120);
</script>
</body>
</html>
